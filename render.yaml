services:
  - type: web
    name: shloka-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CREDENTIAL_ENC_KEY
        sync: false
      - key: CREDENTIAL_RETENTION
        value: until_removed
      # Brevo HTTPS email API — preferred on Render (free tier blocks SMTP).
      # Set the key in the dashboard; sender address is SMTP_FROM.
      - key: BREVO_API_KEY
        sync: false
      # SMTP (optional) — powers the one-click "Send email" of credentials and
      # the request-signup notifications. Set real values in the Render
      # dashboard; SMTP_PORT must be numeric. If email is unused, remove these
      # entries (leaving them blank will fail validation on boot).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SIGNUP_NOTIFY_EMAIL
        sync: false
